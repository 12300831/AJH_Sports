name: Deploy Frontend to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-frontend-firebase.yml'

env:
  NODE_VERSION: '20.x'
  FIREBASE_PROJECT_ID: ajh-sports-308b4
  VITE_API_URL: https://ajh-sports-backend.azurewebsites.net/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Firebase deploy secret
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "Using FIREBASE_TOKEN for deploy."
          elif [ -n "$FIREBASE_SA" ]; then
            echo "Using FIREBASE_SERVICE_ACCOUNT for deploy."
          else
            echo "::error::Missing FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT GitHub Actions secret."
            exit 1
          fi
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL != '' && secrets.VITE_API_URL || env.VITE_API_URL }}
        run: npm run build

      - name: Authenticate to Google Cloud (service account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools@14.4.0 deploy --only hosting --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive --token "$FIREBASE_TOKEN"
          else
            npx firebase-tools@14.4.0 deploy --only hosting --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive
          fi
